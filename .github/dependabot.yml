version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "npm"
    directory: "/Renderer"
    schedule:
      interval: weekly
    # Renderer updates change the committed bundle; review, rebuild (npm run build) and rerun the publication check.
    open-pull-requests-limit: 5
