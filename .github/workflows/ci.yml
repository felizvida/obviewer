name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "redesign/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-policy:
    name: Publication policy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # OCR and PDF text extraction are required: the check fails closed without them.
      - name: Install inspection tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr poppler-utils unzip

      - name: Scan tracked files
        run: node scripts/publication-check.mjs --tracked

      - name: Scan commit metadata (pull requests)
        if: github.event_name == 'pull_request'
        run: node scripts/publication-check.mjs --git-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  renderer:
    name: Renderer (Node)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Renderer

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Renderer/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Committed bundle is up to date
        run: node build.mjs --check

  swift-package:
    name: Swift Package (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Obviewer supports Apple silicon Macs with macOS 26 or later only
        # (decisions of November 14 and 15, 2026), so tests run on macOS 26.
        runner:
          - macos-26  # Apple silicon (arm64)
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  scaffolding:
    name: Scaffolding Checks
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate entitlements
        run: |
          plutil -lint Configuration/Obviewer.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' Configuration/Obviewer.entitlements)" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.files.user-selected.read-only' Configuration/Obviewer.entitlements)" = "true"
          ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.files.user-selected.read-write' Configuration/Obviewer.entitlements
          ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.server' Configuration/Obviewer.entitlements
          ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' Configuration/ObviewerQuickLook.entitlements
          plutil -lint Configuration/ObviewerQuickLook.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' Configuration/ObviewerQuickLook.entitlements)" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.files.user-selected.read-only' Configuration/ObviewerQuickLook.entitlements)" = "true"
          ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.files.user-selected.read-write' Configuration/ObviewerQuickLook.entitlements

      - name: Validate packaging scripts
        run: |
          bash -n scripts/build_app.sh scripts/generate_xcode_project.sh scripts/notarize_release_app.sh scripts/package_release_app.sh scripts/package_release_dmg.sh scripts/release_common.sh
          test -x scripts/build_app.sh
          test -x scripts/generate_xcode_project.sh
          test -x scripts/notarize_release_app.sh
          test -x scripts/package_release_app.sh
          test -x scripts/package_release_dmg.sh

      - name: Validate release hardening settings
        run: |
          grep -q "ENABLE_HARDENED_RUNTIME: YES" project.yml
          grep -q "securityScopeAllowOnlyReadAccess" Sources/ObviewerMacApp/Services/BookmarkStore.swift
          grep -q "com.apple.security.files.user-selected.read-write" scripts/release_common.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: ./scripts/generate_xcode_project.sh

      - name: Confirm generated project
        run: test -d Obviewer.xcodeproj

      - name: Build app (unsigned, compile check)
        run: |
          set -o pipefail
          xcodebuild -project Obviewer.xcodeproj -scheme Obviewer -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build | tail -n 40

  benchmark-profiles:
    name: Benchmark ${{ matrix.profile }}
    runs-on: macos-26
    needs:
      - swift-package
      - publication-policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: smoke
            budget: Configuration/benchmark-smoke-budget.json
          - profile: integration
            budget: ""
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run benchmark
        run: |
          mkdir -p build/reports
          PROFILE=${{ matrix.profile }} \
          FORMAT=json \
          OUTPUT=build/reports/benchmark-${{ matrix.profile }}.json \
          SUMMARY=build/reports/benchmark-${{ matrix.profile }}.md \
          BUDGET='${{ matrix.budget }}' \
          make benchmark-vault

      # Reports stay on the runner: no job summary and no artifact, so nothing generated
      # is published without the maintainer's pre-publication guard. The smoke budget is
      # still enforced by the run above.
